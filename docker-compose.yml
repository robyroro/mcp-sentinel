name: mcp-sentinel

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    <<: *security

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    <<: *security

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SENTINEL_S3_ACCESS_KEY:-sentinel}
      MINIO_ROOT_PASSWORD: ${SENTINEL_S3_SECRET_KEY:-sentinel_dev_only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 4s
      retries: 20
    networks: [control]
    <<: *security

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${SENTINEL_S3_ACCESS_KEY}" "$${SENTINEL_S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/sentinel-artifacts &&
        mc anonymous set none local/sentinel-artifacts
    environment:
      SENTINEL_S3_ACCESS_KEY: ${SENTINEL_S3_ACCESS_KEY:-sentinel}
      SENTINEL_S3_SECRET_KEY: ${SENTINEL_S3_SECRET_KEY:-sentinel_dev_only}
    networks: [control]
    <<: *security

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: [sandbox]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandbox-control]
    read_only: true
    tmpfs: [/run]
    <<: *security

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SENTINEL_ENV: development
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_only}@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_S3_ENDPOINT: http://minio:9000
      SENTINEL_S3_BUCKET: sentinel-artifacts
      SENTINEL_SESSION_SECRET: ${SENTINEL_SESSION_SECRET:-replace-with-at-least-32-random-characters}
      SENTINEL_GATEWAY_API_TOKEN: ${SENTINEL_GATEWAY_API_TOKEN:-dev-gateway-token-change-me}
      SENTINEL_SIGNING_KEY_PATH: /data/signing-key.pem
      SENTINEL_COOKIE_SECURE: "false"
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - sentinel-data:/data
      - report-data:/app/reports/generated
      - audit-data:/app/audit-output
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [control, sandbox-control]
    <<: *security

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "apps.worker.worker.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel_dev_only}@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_SIGNING_KEY_PATH: /data/signing-key.pem
    volumes:
      - sentinel-data:/data
      - report-data:/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [control]
    <<: *security

  safe-filesystem:
    build:
      context: .
      dockerfile: examples/Dockerfile
    command: ["--profile", "safe-filesystem", "--transport", "http", "--port", "9010"]
    environment:
      SENTINEL_DEMO_WORKSPACE: /workspace/project
    volumes:
      - ./examples/demo-workspace:/workspace/project:rw
    read_only: true
    tmpfs: [/tmp]
    networks: [mcp-servers]
    <<: *security

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      SENTINEL_API_URL: http://api:8000
      SENTINEL_GATEWAY_API_TOKEN: ${SENTINEL_GATEWAY_API_TOKEN:-dev-gateway-token-change-me}
      SENTINEL_UPSTREAM_URL: http://safe-filesystem:9010/mcp
      SENTINEL_SERVER_NAME: Safe Filesystem
      SENTINEL_CLIENT_ID: codex-local
      SENTINEL_WORKSPACE: acme-security
      SENTINEL_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      safe-filesystem:
        condition: service_started
    networks: [control, mcp-servers]
    read_only: true
    tmpfs: [/tmp]
    <<: *security

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SENTINEL_API_ORIGIN: http://api:8000
    environment:
      SENTINEL_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    <<: *security

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    networks: [control]
    <<: *security

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    networks: [control]
    <<: *security

  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"
    networks: [control]
    <<: *security

networks:
  control:
    internal: false
  mcp-servers:
    internal: true
  sandbox-control:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  sentinel-data:
  report-data:
  audit-data:

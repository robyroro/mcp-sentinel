name: Documentation

on:
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
      - "scripts/check_docs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

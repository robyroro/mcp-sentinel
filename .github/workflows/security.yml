name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: python -m pip install -e ".[dev,postgres,worker]" pip-audit pip-licenses
      - run: pip-audit
      - name: Reject strong-copyleft runtime dependencies
        run: pip-licenses --fail-on="GPL-2.0-only;GPL-3.0-only;AGPL-1.0-only;AGPL-3.0-only"
      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          work-dir: apps/gateway

  filesystem-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker build -f apps/gateway/Dockerfile -t mcp-sentinel/gateway:scan .
      - name: Gateway container scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: mcp-sentinel/gateway:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

name: Documentation issue
description: Report inaccurate, incomplete, or broken documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes: {label: Page or link}
    validations: {required: true}
  - type: textarea
    id: issue
    attributes: {label: What is inaccurate or unclear?}
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested correction}
  - type: checkboxes
    id: verified
    attributes:
      label: Verification
      options:
        - label: I checked the current main branch and the relevant documented command/version.
          required: true

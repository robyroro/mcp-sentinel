name: Feature request
description: Propose a scoped product or platform improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or safety gap should be solved?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and compatibility impact
      description: Include fail-open/closed behavior and stored data changes.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I am not presenting a roadmap item as already supported.
          required: true
